name: IleZostaje privacy policy availability

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ilezostaje-privacy-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out monitor
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Monitor regression tests (offline)
        run: node --test scripts/tests/check-ilezostaje-privacy.test.mjs

      - name: Check public PL and EN privacy policies
        run: node scripts/check-ilezostaje-privacy.mjs
